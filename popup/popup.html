<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RelayContext</title>
    <link rel="stylesheet" href="popup.css">
</head>

<body>
    <h1>RelayContext</h1>
    <p>Your context, connected.</p>
    <div id="modeSelector">
        <label><input type="radio" name="mode" value="compact" checked> Compact</label>
        <label><input type="radio" name="mode" value="full"> Full</label>
    </div>

    <button id="captureBtn">Capture Context</button>
    <button id="copyBtn" disabled>Copy</button>
    <button id="exportBtn" disabled>Export State File</button>

    <div class="target-section">
        <h3>Send to:</h3>
        <button class="target-btn" data-platform="chatgpt" data-url="https://chatgpt.com" disabled>ChatGPT</button>
        <button class="target-btn" data-platform="claude" data-url="https://claude.ai" disabled>Claude</button>
        <button class="target-btn" data-platform="gemini" data-url="https://gemini.google.com" disabled>Gemini</button>
        <button class="target-btn" data-platform="copilot" data-url="https://copilot.microsoft.com"disabled>Copilot</button>
        <button class="target-btn" data-platform="grok" data-url="https://grok.com" disabled>Grok</button>
    </div>

    <div id="contextContainer">
        <h3>Captured Context</h3>

        <p id="pageTitle">No page captured yet...</p>
        <p id="pageUrl"></p>
        <pre id="pageText"></pre>
    </div>


    <script src="popup.js"></script>
</body>

</html>
