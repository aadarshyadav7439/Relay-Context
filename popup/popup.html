<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RelayContext</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <h1>RelayContext</h1>
    <p class="tagline">Your context, connected.</p>
  </header>

  <div class="mode-selector">
    <label class="mode-option">
      <input type="radio" name="mode" value="compact" checked>
      <span>Compact</span>
    </label>
    <label class="mode-option">
      <input type="radio" name="mode" value="full">
      <span>Full</span>
    </label>
  </div>

  <button id="captureBtn" class="btn btn-primary">Capture Context</button>

  <div id="statusCard" class="status-card status-empty">
    <span id="statusIcon" class="status-icon">○</span>
    <div class="status-text">
      <p id="statusTitle">No context captured yet</p>
      <p id="statusMeta"></p>
    </div>
  </div>

  <div class="action-row">
    <button id="copyBtn" class="btn btn-secondary" disabled>Copy</button>
    <button id="exportBtn" class="btn btn-secondary" disabled>Export</button>
  </div>

  <label class="toggle-row">
    <input type="checkbox" id="autoSendToggle" checked>
    <span>Auto-send after injecting</span>
  </label>

  <div class="target-section">
    <h3>Send to</h3>
    <div class="target-grid">
      <button class="target-btn" data-platform="chatgpt" data-url="https://chatgpt.com" disabled>ChatGPT</button>
      <button class="target-btn" data-platform="claude" data-url="https://claude.ai" disabled>Claude</button>
      <button class="target-btn" data-platform="gemini" data-url="https://gemini.google.com" disabled>Gemini</button>
      <button class="target-btn" data-platform="copilot" data-url="https://copilot.microsoft.com" disabled>Copilot</button>
      <button class="target-btn" data-platform="grok" data-url="https://grok.com" disabled>Grok</button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
